<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Campus - Skip Queue</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="layout-wrapper">
        <header class="top-nav">
            <nav>
                <a href="#" class="nav-link">About Us</a>
                <a href="#" class="nav-link">Location</a>
            </nav>
        </header>

        <main class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">PRINT CAMPUS</h1>
                <p class="hero-subtitle">Your ideas, printed fast & affordably</p>

                <div class="cta-buttons">
                    <button class="btn btn-primary" id="uploadBtn">
                        Upload Your Project
                        <span class="arrow-icon">→</span>
                    </button>
                    <button class="btn btn-secondary">
                        See Services & Pricing
                    </button>
                </div>
            </div>

            <!-- Background illustration -->
            <div class="hero-bg">
                <img src="assets/bg.png" alt="Print Campus Storefronts">
            </div>
        </main>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">&times;</button>
            <div class="modal-header">
                <button class="toggle-btn active" id="showLoginBtn">Login</button>
                <button class="toggle-btn" id="showSignupBtn">Sign Up</button>
            </div>
            
            <form id="authForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password">
                </div>
                
                <div id="authError" class="auth-error"></div>
                
                <button type="submit" class="btn btn-primary submit-btn" id="authSubmitBtn">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
